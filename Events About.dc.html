<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
[data-ea-noscroll]::-webkit-scrollbar { display:none; }
@keyframes eaBlink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
</style>
</helmet>
<div ref="{{ rootRef }}" style="width:100%;display:flex;flex-wrap:wrap;gap:24px;align-items:stretch;font-family:'Satoshi','Helvetica Neue',Arial,sans-serif;color:#EFEFF2">
  <div style="flex:1.3 1 420px;min-width:0;border-radius:18px;border:1px solid #1F1F24;background:#0B0B0E;overflow:hidden;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1C1C21;background:rgba(14,14,22,0.58);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#8C8C93">
      <div style="display:flex;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#FF5F57"></span><span style="width:10px;height:10px;border-radius:50%;background:#FEBC2E"></span><span style="width:10px;height:10px;border-radius:50%;background:#28C840"></span></div>
      <span>theevents.app.ts</span>
      <button onClick="{{ replay }}" data-cursor-hover="true" style="margin-left:auto;background:none;border:1px solid #26262B;border-radius:100px;color:#8C8C93;font-family:inherit;font-size:11px;padding:5px 10px;cursor:pointer">↻ replay</button>
    </div>
    <div data-ea-noscroll="true" style="flex:1;padding:18px 0;overflow-x:auto;scrollbar-width:none;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.85">
      <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="18">
        <div style="display:flex;gap:16px;white-space:pre;padding:0 18px;background:{{ ln.bg }};transition:background 0.3s ease">
          <span style="width:18px;flex-shrink:0;text-align:right;color:#3A3A42">{{ ln.n }}</span>
          <span><sc-for list="{{ ln.toks }}" as="tk" hint-placeholder-count="3"><span style="color:{{ tk.c }}">{{ tk.t }}</span></sc-for><sc-if value="{{ ln.caret }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;width:7px;height:15px;vertical-align:-3px;background:#F3A195;animation:eaBlink 0.8s steps(1) infinite"></span></sc-if></span>
        </div>
      </sc-for>
    </div>
    <div style="padding:12px 18px;border-top:1px solid #1C1C21;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:{{ termColor }}"><span style="color:#5C5C63">$ </span>{{ term }}</div>
  </div>
  <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
      <div onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="position:relative;flex:1;border-radius:16px;border:1px solid {{ c.border }};background:{{ c.bg }};padding:18px 20px;opacity:{{ c.op }};transform:{{ c.tf }};transition:all 0.5s cubic-bezier(0.16,1,0.3,1)">
        <div style="display:flex;justify-content:space-between;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:0.1em;color:{{ c.tagColor }}"><span>{{ c.tag }}</span><span style="color:#3A3A42">{{ c.ref }}</span></div>
        <div style="margin-top:8px;font-family:'Clash Display',sans-serif;font-weight:500;font-size:20px;line-height:1.2">{{ c.title }}</div>
        <p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#B4B4BB;text-wrap:pretty">{{ c.body }}</p>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const C = { k:'#C792EA', s:'#A5E075', key:'#7FDBFF', b:'#FF8A6B', p:'#8C8C93', c:'#5C5C63', v:'#EFEFF2' };
const CODE = [
  '// TheEvents, explained in one file',
  'export const app = {',
  "  is: 'A shopping app for celebrations and gifting',",
  "  market: 'UAE and the Middle East',",
  "  sells: ['Fashion', 'Beauty', 'Home', 'Electronics'],",
  '  for: {',
  "    shoppers: 'find, compare and buy for any occasion',",
  "    vendors:  'open a store, list products, get paid',",
  "    creators: 'makeup artists with portfolios and bookings',",
  '  },',
  "  ai: ['gift finder', 'voice search', 'visual search', 'style match'],",
  '  checkout: {',
  '    applePay: true, giftWrap: true, coupons: true,',
  "    delivery: 'scheduled + live tracking',",
  '  },',
  "  platforms: ['iOS', 'Android', 'Vendor web portal'],",
  '};',
];
const SEG = [
  { from:2, to:4, tag:'WHAT IT IS', title:'One app for every celebration', body:'An e-commerce app for the Middle East where people shop for occasions and gifts: fashion, beauty, home and electronics in one place.' },
  { from:5, to:9, tag:'WHO IT’S FOR', title:'Shoppers, vendors and creators', body:'Shoppers buy for any occasion, vendors run their own store with payouts, and makeup artists show portfolios and take bookings.' },
  { from:10, to:10, tag:'HOW AI HELPS', title:'Ask instead of scrolling', body:'A gift finder, voice search, visual search with the camera and style matching turn a big catalogue into a short list.' },
  { from:11, to:15, tag:'WHY IT’S FAST', title:'Checkout in a few taps', body:'Apple Pay, gift wrap, coupons and scheduled delivery with live tracking, on iOS, Android and a vendor web portal.' },
];
function tokenize(line) {
  if (line.trim().startsWith('//')) return [{ t:line, c:C.c }];
  const out = []; const re = /('[^']*')|\b(export|const|true|false)\b|([A-Za-z_]+)(?=:)|(\s+)|([^\s'A-Za-z_]+|[A-Za-z_]+)/g; let m;
  while ((m = re.exec(line))) {
    if (m[1]) out.push({ t:m[1], c:C.s }); else if (m[2]) out.push({ t:m[2], c: m[2] === 'true' || m[2] === 'false' ? C.b : C.k });
    else if (m[3]) out.push({ t:m[3], c:C.key }); else out.push({ t:m[4] || m[5], c: m[5] && /^[A-Za-z_]+$/.test(m[5]) ? C.v : C.p });
  }
  return out;
}
const TOKS = CODE.map(tokenize);
const ENDS = []; { let a = 0; CODE.forEach(l => { a += l.length; ENDS.push(a); }); }
const TOTAL = ENDS[ENDS.length - 1];
const RATE = 0.085;

class Component extends DCLogic {
  state = { el:0, started:false, hov:-1 };
  rootRef = React.createRef();
  componentDidMount() {
    this.last = performance.now();
    this.iv = setInterval(() => {
      const now = performance.now(), dt = Math.min(120, now - this.last); this.last = now;
      if (!this.state.started || this.state.el > TOTAL / RATE + 400) return;
      this.setState(s => ({ el: s.el + dt }));
    }, 40);
    if (window.IntersectionObserver && this.rootRef.current) {
      this.io = new IntersectionObserver(es => { if (es[0].isIntersecting) this.setState({ started:true }); }, { threshold:0.25 });
      this.io.observe(this.rootRef.current);
    } else this.setState({ started:true });
  }
  componentWillUnmount() { clearInterval(this.iv); if (this.io) this.io.disconnect(); }
  renderVals() {
    const { el, hov } = this.state;
    const chars = Math.floor(el * RATE);
    const done = chars >= TOTAL;
    let left = chars, caretLine = -1;
    const curLine = ENDS.findIndex(e => e > chars);
    const hl = hov >= 0 ? SEG[hov] : null;
    const lines = TOKS.map((toks, li) => {
      const vis = [];
      for (const tk of toks) { if (left <= 0) break; vis.push({ t: tk.t.slice(0, left), c: tk.c }); left -= tk.t.length; }
      const caret = done ? li === CODE.length - 1 : li === curLine;
      const on = hl && li >= hl.from && li <= hl.to;
      return { n: li + 1, toks: vis, caret, bg: on ? 'rgba(243,161,149,0.10)' : 'transparent' };
    });
    return {
      rootRef: this.rootRef,
      replay: () => this.setState({ el:0, started:true }),
      lines,
      term: done ? '✓ 3 user types · 6 feature areas · 500+ screens designed' : 'compiling theevents.app.ts…',
      termColor: done ? '#A5E075' : '#8C8C93',
      cards: SEG.map((s, k) => {
        const ready = chars >= ENDS[s.to];
        const on = hov === k;
        return {
          tag: s.tag, title: s.title, body: s.body, ref: 'L' + (s.from + 1) + (s.to > s.from ? '–' + (s.to + 1) : ''),
          op: ready ? 1 : 0.18, tf: ready ? 'none' : 'translateY(10px)',
          border: on ? 'rgba(243,161,149,0.55)' : (ready ? '#26262B' : '#18181C'),
          bg: on ? 'rgba(243,161,149,0.07)' : '#0E0E12', tagColor: ready ? '#F3A195' : '#3A3A42',
          enter: () => this.setState({ hov:k }), leave: () => this.setState({ hov:-1 }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
